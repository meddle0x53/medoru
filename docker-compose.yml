services:
  postgres:
    image: postgres:16-alpine
    container_name: medoru-postgres
    environment:
      POSTGRES_USER: meddle
      POSTGRES_DB: medoru_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - medoru-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meddle -d medoru_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medoru-postgres-data:
